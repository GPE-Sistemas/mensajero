<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "titulo" .}}IRIX{{end}}</title>
</head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;">
{{/* gestion manda los mails de IRIX y de FARO. El marco por defecto es el de IRIX;
     una plantilla de FARO redefine "titulo", "cabecera" y "pie". */}}
{{block "cabecera" .}}
<tr><td style="padding:24px 32px;border-top:4px solid #D32F2F;border-bottom:1px solid #e5e7eb;border-radius:8px 8px 0 0;">
<span style="font-size:26px;font-weight:bold;letter-spacing:2px;color:#D32F2F;">IRIX</span>
</td></tr>
{{end}}
<tr><td style="padding:32px;font-size:15px;line-height:1.6;">
{{template "contenido" .}}
</td></tr>
<tr><td style="padding:20px 32px;background:#f9fafb;border-radius:0 0 8px 8px;font-size:12px;line-height:1.5;color:#6b7280;">
{{block "pie" .}}IRIX · GPE Sistemas · Mensaje automático, no lo respondas.{{end}}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
