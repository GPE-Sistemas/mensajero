{{define "contenido"}}
<h1 style="margin:0 0 16px;font-size:20px;color:#b91c1c;">Valor fuera de límite</h1>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 16px;font-size:15px;">
<tr><td style="padding:4px 16px 4px 0;color:#6b7280;">Punto</td><td style="padding:4px 0;font-weight:bold;">{{.punto}}</td></tr>
<tr><td style="padding:4px 16px 4px 0;color:#6b7280;">Variable</td><td style="padding:4px 0;">{{.variable}}</td></tr>
<tr><td style="padding:4px 16px 4px 0;color:#6b7280;">Valor</td><td style="padding:4px 0;font-weight:bold;color:#b91c1c;">{{.valor}}</td></tr>
<tr><td style="padding:4px 16px 4px 0;color:#6b7280;">Límite</td><td style="padding:4px 0;">{{.limite}}: {{.valorLimite}}</td></tr>
<tr><td style="padding:4px 16px 4px 0;color:#6b7280;">Fecha</td><td style="padding:4px 0;">{{.fecha}}</td></tr>
</table>
<p style="margin:0;">Vas a recibir otro aviso cuando el valor vuelva a la normalidad.</p>
{{end}}
