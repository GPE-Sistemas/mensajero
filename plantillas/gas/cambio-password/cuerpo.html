{{define "contenido"}}
<h1 style="margin:0 0 16px;font-size:20px;">Tu contraseña cambió</h1>
<p style="margin:0 0 16px;">Un administrador cambió la contraseña de tu usuario. La nueva es:</p>
<p style="margin:0 0 16px;font-size:18px;font-weight:bold;font-family:monospace;">{{.codigo}}</p>
<p style="margin:24px 0;"><a href="{{.link}}" style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-weight:bold;">Entrar</a></p>
<p style="margin:0;">Si no esperabas este cambio, avisale al administrador de tu cuenta.</p>
{{end}}
