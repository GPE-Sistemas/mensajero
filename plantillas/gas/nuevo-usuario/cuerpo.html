{{define "contenido"}}
<h1 style="margin:0 0 16px;font-size:20px;">Ya tenés usuario en INSIDE Horatech</h1>
<p style="margin:0 0 16px;">Estos son tus datos para entrar:</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 16px;font-size:15px;">
<tr><td style="padding:4px 16px 4px 0;color:#6b7280;">Usuario</td><td style="padding:4px 0;font-weight:bold;">{{.usuario}}</td></tr>
<tr><td style="padding:4px 16px 4px 0;color:#6b7280;">Contraseña</td><td style="padding:4px 0;font-weight:bold;font-family:monospace;">{{.password}}</td></tr>
</table>
<p style="margin:24px 0;"><a href="{{.link}}" style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-weight:bold;">Entrar</a></p>
<p style="margin:0;">Te recomendamos cambiar la contraseña la primera vez que entres.</p>
{{end}}
